<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link href="style.css" rel="stylesheet" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="results-div">
        <h3 class="results">0</h3>
      </div>

      <div class="manipulation-div">
        <div class="calc-row">
          <button class="btn-calc dark-grey" data-action="delete" type="button">
            ⌫
          </button>
          <button class="btn-calc dark-grey" data-action="clear" type="button">
            AC
          </button>
          <button class="btn-calc dark-grey" data-operator="%" type="button">
            %
          </button>
          <button class="btn-calc orange" data-operator="/" type="button">
            ➗
          </button>
        </div>

        <div class="calc-row">
          <button class="btn-calc light-grey" data-number="7" type="button">
            7
          </button>
          <button class="btn-calc light-grey" data-number="8" type="button">
            8
          </button>

          <button class="btn-calc light-grey" data-number="9" type="button">
            9
          </button>
          <button class="btn-calc orange" data-operator="*" type="button">
            ×
          </button>
        </div>

        <div class="calc-row">
          <button class="btn-calc light-grey" data-number="4" type="button">
            4
          </button>
          <button class="btn-calc light-grey" data-number="5" type="button">
            5
          </button>

          <button class="btn-calc light-grey" data-number="6" type="button">
            6
          </button>
          <button class="btn-calc orange" data-operator="-" type="button">
            -
          </button>
        </div>
        <div class="calc-row">
          <button class="btn-calc light-grey" data-number="1" type="button">
            1
          </button>
          <button class="btn-calc light-grey" data-number="2" type="button">
            2
          </button>

          <button class="btn-calc light-grey" data-number="3" type="button">
            3
          </button>
          <button class="btn-calc orange" data-operator="+" type="button">
            +
          </button>
        </div>

        <div class="calc-row">
          <button class="btn-calc light-grey" data-number="0" type="button">
            0
          </button>
          <button class="btn-calc light-grey" data-number="." type="button">
            .
          </button>

          <button class="btn-calc equal orange" data-operator="=" type="button">
            =
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
